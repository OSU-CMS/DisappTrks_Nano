# LPC Dask settings for writing full-event Z-sideband ROOT skims.
scaleout: 50
chunksize: 25000
cores-per-worker: 1
mem-per-worker: "6GB"
disk-per-worker: "10GB"
queue: "workday"
adaptive: false
retries: 10
tree-reduction: 8
skip-bad-files: true

dask-scheduler-port: null
dask-scheduler-host: null
dask-worker-start-timeout: 1800

local-virtualenv: true
conda-env: false
worker-python: "/srv/.env/bin/python"
custom-setup-commands: null
